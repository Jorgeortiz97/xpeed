name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      # The veth tests create network namespaces and load XDP programs.
      - name: Test
        run: cargo test --locked --config 'target."cfg(target_os = \"linux\")".runner = "sudo -E"' -- --include-ignored
