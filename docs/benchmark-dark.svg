<svg xmlns="http://www.w3.org/2000/svg" width="840" height="214" viewBox="0 0 840 214" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" role="img" aria-labelledby="t d">
<title id="t">xpeed vs iperf3</title>
<desc id="d">One xpeed stream sends 808 kpps of 64-byte frames against 74 kpps for iperf3. At 70 kpps, xpeed uses 22% of a core on the sender (iperf3 90%) and 47% on the receiver (iperf3 114%).</desc>
<rect width="840" height="214" rx="8" fill="#1a1a19"/>
<rect x="24" y="24" width="12" height="12" rx="3" fill="#3987e5"/>
<text x="42" y="34.5" font-size="13" fill="#c3c2b7">xpeed</text>
<rect x="102" y="24" width="12" height="12" rx="3" fill="#d95926"/>
<text x="120" y="34.5" font-size="13" fill="#c3c2b7">iperf3</text>
<text x="816" y="34.5" font-size="12" fill="#898781" text-anchor="end">1 Gbit/s link, 10 s per run, UDP</text>
<text x="24.0" y="68" font-size="15" font-weight="600" fill="#f0efec">Packet rate</text>
<text x="24.0" y="87" font-size="12" fill="#c3c2b7">64-byte frames, one stream</text>
<text x="68.0" y="123.5" font-size="13" fill="#c3c2b7" text-anchor="end">xpeed</text>
<path d="M76.0,108.0 h114.7 a4,4 0 0 1 4,4 v14.0 a4,4 0 0 1 -4,4 h-114.7 z" fill="#3987e5"/>
<text x="202.66666666666663" y="123.5" font-size="13" font-weight="600" fill="#f0efec">808 kpps</text>
<text x="68.0" y="155.5" font-size="13" fill="#c3c2b7" text-anchor="end">iperf3</text>
<path d="M76.0,140.0 h6.9 a4,4 0 0 1 4,4 v14.0 a4,4 0 0 1 -4,4 h-6.9 z" fill="#d95926"/>
<text x="94.86798679867987" y="155.5" font-size="13" font-weight="600" fill="#f0efec">74 kpps</text>
<line x1="76.0" y1="102" x2="76.0" y2="174" stroke="#383835" stroke-width="1"/>
<text x="24.0" y="198" font-size="12" fill="#898781">higher is better</text>
<text x="298.66666666666663" y="68" font-size="15" font-weight="600" fill="#f0efec">Sender CPU</text>
<text x="298.66666666666663" y="87" font-size="12" fill="#c3c2b7">at 70 kpps, % of one core</text>
<text x="342.66666666666663" y="123.5" font-size="13" fill="#c3c2b7" text-anchor="end">xpeed</text>
<path d="M350.7,108.0 h25.0 a4,4 0 0 1 4,4 v14.0 a4,4 0 0 1 -4,4 h-25.0 z" fill="#3987e5"/>
<text x="387.67407407407404" y="123.5" font-size="13" font-weight="600" fill="#f0efec">22%</text>
<text x="342.66666666666663" y="155.5" font-size="13" fill="#c3c2b7" text-anchor="end">iperf3</text>
<path d="M350.7,140.0 h114.7 a4,4 0 0 1 4,4 v14.0 a4,4 0 0 1 -4,4 h-114.7 z" fill="#d95926"/>
<text x="477.33333333333326" y="155.5" font-size="13" font-weight="600" fill="#f0efec">90%</text>
<line x1="350.66666666666663" y1="102" x2="350.66666666666663" y2="174" stroke="#383835" stroke-width="1"/>
<text x="298.66666666666663" y="198" font-size="12" fill="#898781">lower is better</text>
<text x="573.3333333333333" y="68" font-size="15" font-weight="600" fill="#f0efec">Receiver CPU</text>
<text x="573.3333333333333" y="87" font-size="12" fill="#c3c2b7">at 70 kpps, % of one core</text>
<text x="617.3333333333333" y="123.5" font-size="13" fill="#c3c2b7" text-anchor="end">xpeed</text>
<path d="M625.3,108.0 h44.9 a4,4 0 0 1 4,4 v14.0 a4,4 0 0 1 -4,4 h-44.9 z" fill="#3987e5"/>
<text x="682.2573099415204" y="123.5" font-size="13" font-weight="600" fill="#f0efec">47%</text>
<text x="617.3333333333333" y="155.5" font-size="13" fill="#c3c2b7" text-anchor="end">iperf3</text>
<path d="M625.3,140.0 h114.7 a4,4 0 0 1 4,4 v14.0 a4,4 0 0 1 -4,4 h-114.7 z" fill="#d95926"/>
<text x="751.9999999999999" y="155.5" font-size="13" font-weight="600" fill="#f0efec">114%</text>
<line x1="625.3333333333333" y1="102" x2="625.3333333333333" y2="174" stroke="#383835" stroke-width="1"/>
<text x="573.3333333333333" y="198" font-size="12" fill="#898781">lower is better</text>
</svg>
