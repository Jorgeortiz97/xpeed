[package]
name = "xpeed"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "High-performance network benchmarking powered by XDP"
publish = false

[dependencies]
anyhow = "1"
aya = "0.13.1"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
nix = { version = "0.30", features = ["net", "resource", "sched", "signal", "socket"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.5", features = ["all"] }

[profile.release]
lto = true
strip = true
